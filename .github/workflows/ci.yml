name: CI

# A cada push na main: builda o projeto e roda a suite de testes completa
# (unitarios + integracao com Testcontainers) para confirmar que a API
# continua funcionando corretamente. O job de build da imagem Docker so
# roda depois dos testes passarem, e confirma que o artefato que a gente
# efetivamente distribui (ver README/run.sh) continua buildando.
on:
  push:
    branches: [main]

jobs:
  test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ./mvnw verify roda as duas camadas de teste (ver .specs/testing.md):
      # unitarios (Mockito, rapido) e depois o de integracao
      # (AplicacaoRepositoryIT, sobe um Postgres real via Testcontainers -
      # os runners do GitHub ja tem Docker disponivel, sem setup extra).
      - name: Build + testes (unitarios e integracao)
        run: ./mvnw --batch-mode --no-transfer-progress verify

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v5

      - name: Build da imagem (Dockerfile da raiz)
        run: docker build -t invest-renda-api:ci -f Dockerfile .
