server:
  port: 8080

spring:
  application:
    name: invest-renda-api

  datasource:
    url: jdbc:postgresql://localhost:5433/invest_renda
    username: invest_renda
    password: invest_renda
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

investrenda:
  rabbitmq:
    exchange: investrenda.aplicacoes.exchange
    fila: investrenda.aplicacoes.fila
    chave-roteamento: investrenda.aplicacoes.aplicar
    fila-morta: investrenda.aplicacoes.fila.morta
  limiterequisicoes:
    habilitado: true
    capacidade: 120                    # rajada maxima permitida por cliente (IP)
    tokens-reposicao: 120               # tokens devolvidos por janela
    duracao-reposicao-segundos: 60      # duracao da janela (120 req/min por padrao)
  integracaoexterna:
    habilitado: true                   # feature toggle - liga/desliga a chamada a API externa
    url-base: https://economia.awesomeapi.com.br

resilience4j:
  circuitbreaker:
    instances:
      cotacaoDolar:
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        failure-rate-threshold: 50               # % de falhas na janela que abre o circuito
        wait-duration-in-open-state: 10s         # tempo de circuito aberto antes de testar de novo
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.bancointer.investrenda.exception.FalhaConsultaCotacaoException
        ignore-exceptions:
          - com.bancointer.investrenda.exception.IntegracaoDesabilitadaException
  retry:
    instances:
      cotacaoDolar:
        max-attempts: 3                          # mesmo padrao do consumer RabbitMQ
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2        # 1s / 2s / 4s
        retry-exceptions:
          - com.bancointer.investrenda.exception.FalhaConsultaCotacaoException

logging:
  level:
    com.bancointer.investrenda: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true      # mostra quanto tempo cada chamada "Try it out" levou
    doc-expansion: none                 # comeca com os grupos recolhidos, nao com tudo aberto

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    health:
      show-details: never
