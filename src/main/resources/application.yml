server:
  port: 8080

spring:
  application:
    name: invest-renda-api

  datasource:
    url: jdbc:postgresql://localhost:5433/invest_renda
    username: invest_renda
    password: invest_renda
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

investrenda:
  rabbitmq:
    exchange: investrenda.aplicacoes.exchange
    fila: investrenda.aplicacoes.fila
    chave-roteamento: investrenda.aplicacoes.aplicar
    fila-morta: investrenda.aplicacoes.fila.morta
  limiterequisicoes:
    habilitado: true
    capacidade: 120                    # rajada maxima permitida por cliente (IP)
    tokens-reposicao: 120               # tokens devolvidos por janela
    duracao-reposicao-segundos: 60      # duracao da janela (120 req/min por padrao)

logging:
  level:
    com.bancointer.investrenda: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
